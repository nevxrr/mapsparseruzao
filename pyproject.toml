[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mapsparseruzao"
version = "1.0.0"
description = "Парсер компаний ЮЗАО (Москва) без сайта → .xlsx"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "openpyxl>=3.1.2",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mapsparseruzao = "mapsparseruzao.cli:main"

[tool.setuptools.packages.find]
include = ["mapsparseruzao*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
